name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # EchoLM targets Windows; the end-to-end tests run a tiny random Qwen2 on CPU
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,eval,demo]" "transformers>=4.56,<5.6" "peft>=0.17" safetensors
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
